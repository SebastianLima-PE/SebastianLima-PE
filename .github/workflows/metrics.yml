name: 📊 Generate GitHub Analytics & Trophies

on:
  schedule:
    - cron: "0 5 * * *"   # Todos los días a las 00:00 (hora de Lima)
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # Tarjetas de analítica (perfil, lenguajes, commits por hora, stats)
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: -5
          THEME: tokyonight

      # Trofeos propios (github-profile-trophy está sin cuota)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate trophies
        run: |
          git pull --rebase origin main
          node scripts/trophies.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophies.svg
          git diff --cached --quiet || git commit -m "chore: actualizar trofeos"
          git push
