<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sebastian Pariachi — Software Engineer, Full Stack y Mobile. Escena nocturna de la Costa Verde de Lima con el faro de Miraflores">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="45%" stop-color="#0f1430"/>
      <stop offset="75%" stop-color="#2a1f3f"/>
      <stop offset="100%" stop-color="#4a2e3c"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a33"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5f5f0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5f5f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#05070f" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#05070f" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#05070f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#f5d76e" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5d76e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f5f5f0"/>
    </linearGradient>
    <linearGradient id="nameB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5f5f0"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Cielo -->
    <rect width="1200" height="360" fill="url(#sky)"/>
    <g fill="#f5f5f0">
      <circle cx="610" cy="40" r="1.2"/><circle cx="700" cy="95" r="0.9"/>
      <circle cx="760" cy="30" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="830" cy="120" r="0.8"/><circle cx="1040" cy="40" r="1.1"/>
      <circle cx="1120" cy="90" r="0.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1170" cy="30" r="1"/><circle cx="660" cy="150" r="0.7"/>
      <circle cx="980" cy="140" r="0.8"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="50" r="0.9"/><circle cx="300" cy="110" r="0.7"/><circle cx="520" cy="130" r="0.8"/>
    </g>

    <!-- Morro Solar a lo lejos (Chorrillos) -->
    <path d="M0 262 L0 236 C90 222 160 200 250 206 C330 212 380 236 470 250 C520 256 560 260 600 262 Z" fill="#1a1630"/>
    <line x1="232" y1="207" x2="232" y2="190" stroke="#2c2647" stroke-width="2"/>
    <line x1="226" y1="195" x2="238" y2="195" stroke="#2c2647" stroke-width="2"/>

    <!-- Mar -->
    <rect y="262" width="1200" height="98" fill="url(#sea)"/>
    <!-- Reflejo de la luna -->
    <g fill="#f5f5f0">
      <rect x="580" y="270" width="40" height="2" rx="1" opacity="0.5"><animate attributeName="opacity" values="0.5;0.15;0.5" dur="3s" repeatCount="indefinite"/></rect>
      <rect x="570" y="280" width="58" height="2" rx="1" opacity="0.35"><animate attributeName="opacity" values="0.15;0.45;0.15" dur="3.5s" repeatCount="indefinite"/></rect>
      <rect x="586" y="291" width="30" height="2" rx="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="565" y="303" width="70" height="2" rx="1" opacity="0.2"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="4s" repeatCount="indefinite"/></rect>
      <rect x="590" y="316" width="24" height="2" rx="1" opacity="0.3"/>
    </g>
    <!-- Olas -->
    <g stroke="#2a3358" stroke-width="1.5" fill="none" opacity="0.6">
      <path d="M560 300 q15 -4 30 0 t30 0"><animateTransform attributeName="transform" type="translate" values="0 0;-12 0;0 0" dur="6s" repeatCount="indefinite"/></path>
      <path d="M680 330 q15 -4 30 0 t30 0"><animateTransform attributeName="transform" type="translate" values="0 0;10 0;0 0" dur="7s" repeatCount="indefinite"/></path>
      <path d="M980 320 q15 -4 30 0 t30 0"><animateTransform attributeName="transform" type="translate" values="0 0;-10 0;0 0" dur="5s" repeatCount="indefinite"/></path>
    </g>

    <!-- Acantilado de la Costa Verde -->
    <path d="M640 360 L660 300 C680 270 700 250 730 236 L760 214 L1200 196 L1200 360 Z" fill="#0b0d16"/>
    <!-- Vegetación de la Costa Verde -->
    <path d="M668 296 C690 268 712 252 740 236 M700 300 C730 270 760 250 800 232 M760 320 C800 280 840 256 900 236" stroke="#0f3b2c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.45"/>
    <!-- Circuito de playas (pista iluminada) -->
    <path d="M650 340 C760 330 900 322 1200 316" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2 7" fill="none" opacity="0.7">
      <animate attributeName="stroke-dashoffset" values="0;-36" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- Edificios de Miraflores sobre el acantilado -->
    <g fill="#0b0d16">
      <rect x="770" y="170" width="26" height="46"/>
      <rect x="800" y="150" width="20" height="66"/>
      <rect x="824" y="178" width="34" height="38"/>
      <rect x="862" y="140" width="22" height="74"/>
      <rect x="888" y="164" width="30" height="50"/>
      <rect x="1060" y="146" width="24" height="56"/>
      <rect x="1088" y="126" width="28" height="76"/>
      <rect x="1120" y="160" width="34" height="42"/>
      <rect x="1158" y="136" width="24" height="64"/>
    </g>
    <g fill="#d4af37" opacity="0.85">
      <rect x="776" y="180" width="3" height="4"/><rect x="786" y="196" width="3" height="4"/>
      <rect x="806" y="160" width="3" height="4"/><rect x="812" y="182" width="3" height="4"/>
      <rect x="832" y="188" width="3" height="4"/><rect x="846" y="200" width="3" height="4"/>
      <rect x="868" y="152" width="3" height="4"><animate attributeName="opacity" values="1;0;1" dur="5s" repeatCount="indefinite"/></rect>
      <rect x="874" y="176" width="3" height="4"/><rect x="896" y="176" width="3" height="4"/>
      <rect x="1066" y="160" width="3" height="4"/><rect x="1094" y="140" width="3" height="4"/>
      <rect x="1104" y="170" width="3" height="4"/><rect x="1128" y="172" width="3" height="4"/>
      <rect x="1164" y="150" width="3" height="4"><animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/></rect>
    </g>
    <g fill="#10b981" opacity="0.75">
      <rect x="840" y="190" width="3" height="4"/><rect x="1072" y="182" width="3" height="4"/><rect x="1144" y="184" width="3" height="4"/>
    </g>

    <!-- Faro La Marina (Miraflores) -->
    <g transform="translate(990 0)">
      <!-- haz de luz que barre la bahía -->
      <g>
        <polygon points="0,128 -330,96 -330,160" fill="url(#beam)">
          <animateTransform attributeName="transform" type="rotate" values="-8 0 128;10 0 128;-8 0 128" dur="7s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.9;0.4;0.9" dur="7s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <path d="M-11 206 L-7 136 L7 136 L11 206 Z" fill="#e8e4dc"/>
      <path d="M-10.2 190 L-9.2 172 L9.2 172 L10.2 190 Z M-8.3 158 L-7.6 146 L7.6 146 L8.3 158 Z" fill="#c0392b"/>
      <rect x="-10" y="130" width="20" height="6" fill="#1c1c1c"/>
      <rect x="-6" y="120" width="12" height="10" fill="#f5d76e"/>
      <path d="M-8 120 L0 111 L8 120 Z" fill="#c0392b"/>
      <circle cx="0" cy="125" r="14" fill="#f5d76e" opacity="0.25">
        <animate attributeName="opacity" values="0.35;0.1;0.35" dur="1.75s" repeatCount="indefinite"/>
      </circle>
      <rect x="-24" y="204" width="48" height="6" fill="#0b0d16"/>
    </g>

    <!-- Sombra para legibilidad del texto -->
    <rect width="1200" height="360" fill="url(#shade)"/>

    <!-- Luna -->
    <circle cx="600" cy="70" r="70" fill="url(#moonGlow)"/>
    <circle cx="600" cy="70" r="22" fill="#f5f5f0"/>
    <circle cx="592" cy="64" r="4" fill="#dcdcd2"/><circle cx="608" cy="78" r="3" fill="#dcdcd2"/>

    <!-- Texto -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="72" y="88" font-family="'Cascadia Code', Consolas, 'Fira Code', monospace" font-size="15" letter-spacing="3" fill="#10b981">&lt;/&gt; SOFTWARE ENGINEER</text>
      <text x="68" y="170" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="74" fill="url(#nameA)">SEBASTIAN</text>
      <text x="68" y="246" font-family="'Arial Black', 'Segoe UI Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="74" fill="url(#nameB)">PARIACHI</text>
      <text x="72" y="286" font-size="19" fill="#d6d6d0">Full Stack &amp; Mobile Developer  ·  Ing. de Software @ UPC</text>
      <g transform="translate(72 308)">
        <circle cx="6" cy="10" r="5" fill="#10b981">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
        </circle>
        <text x="20" y="15" font-size="14" fill="#9aa3b5">Lima, Perú  ·  Disponible para prácticas</text>
      </g>
    </g>
  </g>
</svg>
