<svg width="900" height="350" viewBox="0 0 900 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="rbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#111111"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <radialGradient id="rGlowL" cx="12%" cy="55%" r="45%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.10"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="rGlowR" cx="90%" cy="55%" r="42%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:0.14"/>
      <stop offset="100%" style="stop-color:#0a0a0a;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:0.15"/>
      <stop offset="45%" style="stop-color:#10b981;stop-opacity:0.85"/>
      <stop offset="75%" style="stop-color:#d4af37;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:0.25"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="55%" style="stop-color:#f0f0e8"/>
      <stop offset="100%" style="stop-color:#d4af37"/>
    </linearGradient>
    <filter id="rsoft"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rstrong"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="900" height="350" fill="url(#rbg)"/>
  <rect width="900" height="350" fill="url(#rGlowL)"/>
  <rect width="900" height="350" fill="url(#rGlowR)"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-family="Georgia, 'Palatino Linotype', serif" font-size="20" font-weight="bold" fill="url(#titleGrad)" letter-spacing="1.2">
    Mi camino en Ingeniería de Software
  </text>
  <rect x="360" y="50" width="180" height="1" rx="0.5" fill="#d4af37" opacity="0.35"/>

  <!-- Track line -->
  <rect x="60" y="199" width="780" height="2" rx="1" fill="url(#trackGrad)"/>

  <!-- Traveling pulse along the track -->
  <circle cx="60" cy="200" r="4.5" fill="#f0f0e8" filter="url(#rstrong)" opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0;780,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="200" r="11" fill="none" stroke="#ffffff" stroke-width="1" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="0,0;780,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0.35;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- ============ 1 — 2023 (above) ============ -->
  <line x1="90" y1="140" x2="90" y2="192" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.45"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.1s"/>
    <rect x="21" y="72" width="138" height="68" rx="8" fill="#101014" stroke="#10b981" stroke-width="1" stroke-opacity="0.45"/>
    <rect x="21" y="72" width="138" height="2.5" rx="1.2" fill="#10b981" opacity="0.8"/>
    <text x="33" y="94" font-family="'Courier New', monospace" font-size="9" fill="#10b981" letter-spacing="1.8">2023</text>
    <text x="33" y="113" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f0e8">Ingreso a UPC</text>
    <text x="33" y="129" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7a7a72">Ingeniería de Software</text>
  </g>
  <circle cx="90" cy="200" r="7" fill="#10b981" filter="url(#rsoft)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.1s"/>
  </circle>
  <circle cx="90" cy="200" r="3" fill="#0a0a0a"/>

  <!-- ============ 2 — Ene 2026 · FinTú (below) ============ -->
  <line x1="270" y1="208" x2="270" y2="260" stroke="#10b981" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.4s"/>
    <rect x="201" y="260" width="138" height="68" rx="8" fill="#101014" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="201" y="260" width="138" height="2.5" rx="1.2" fill="#10b981"/>
    <text x="213" y="282" font-family="'Courier New', monospace" font-size="9" fill="#10b981" letter-spacing="1.8">ENE 2026</text>
    <text x="213" y="301" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f0e8">FinTú &amp; Co.</text>
    <text x="213" y="317" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7a7a72">SaaS financiero · en vivo</text>
  </g>
  <circle cx="270" cy="200" r="7" fill="#10b981" filter="url(#rsoft)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.4s"/>
  </circle>
  <circle cx="270" cy="200" r="3" fill="#0a0a0a"/>

  <!-- ============ 3 — Mar 2026 · Ferova (above) ============ -->
  <line x1="450" y1="140" x2="450" y2="192" stroke="#d4af37" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.7s"/>
    <rect x="381" y="72" width="138" height="68" rx="8" fill="#101014" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="381" y="72" width="138" height="2.5" rx="1.2" fill="#d4af37"/>
    <text x="393" y="94" font-family="'Courier New', monospace" font-size="9" fill="#d4af37" letter-spacing="1.8">MAR 2026</text>
    <text x="393" y="113" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f0e8">Ferova · MINSA</text>
    <text x="393" y="129" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7a7a72">2 apps · Kotlin + Flutter</text>
  </g>
  <circle cx="450" cy="200" r="7" fill="#d4af37" filter="url(#rsoft)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.7s"/>
  </circle>
  <circle cx="450" cy="200" r="3" fill="#0a0a0a"/>

  <!-- ============ 4 — Feb–Jul 2026 · certificaciones (below) ============ -->
  <line x1="630" y1="208" x2="630" y2="260" stroke="#d4af37" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="1s"/>
    <rect x="561" y="260" width="138" height="68" rx="8" fill="#101014" stroke="#d4af37" stroke-width="1" stroke-opacity="0.6"/>
    <rect x="561" y="260" width="138" height="2.5" rx="1.2" fill="#d4af37"/>
    <text x="573" y="282" font-family="'Courier New', monospace" font-size="9" fill="#d4af37" letter-spacing="1.8">FEB–JUL 2026</text>
    <text x="573" y="301" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f0f0e8">4 Certificaciones</text>
    <text x="573" y="317" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#7a7a72">Google · AWS · Michigan</text>
  </g>
  <circle cx="630" cy="200" r="7" fill="#d4af37" filter="url(#rsoft)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1s"/>
  </circle>
  <circle cx="630" cy="200" r="3" fill="#0a0a0a"/>

  <!-- "HOY" marker, below the track -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="1.5s"/>
    <line x1="720" y1="200" x2="720" y2="224" stroke="#f0f0e8" stroke-width="1" opacity="0.35"/>
    <text x="720" y="238" text-anchor="middle" font-family="'Courier New', monospace" font-size="8.5" fill="#f0f0e8" opacity="0.65" letter-spacing="1.2">HOY</text>
    <circle cx="720" cy="200" r="3.5" fill="#f0f0e8" filter="url(#rsoft)">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============ 5 — 2027 · objetivo (above) ============ -->
  <line x1="810" y1="140" x2="810" y2="190" stroke="#d4af37" stroke-width="1" stroke-dasharray="3 3" opacity="0.65"/>
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.6s" fill="freeze" begin="1.3s"/>
    <rect x="741" y="72" width="138" height="68" rx="8" fill="#1a1508" stroke="#d4af37" stroke-width="1.4">
      <animate attributeName="stroke-opacity" values="1;0.45;1" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="741" y="72" width="138" height="2.5" rx="1.2" fill="#d4af37"/>
    <text x="753" y="94" font-family="'Courier New', monospace" font-size="9" fill="#d4af37" letter-spacing="1.8">2027 — NEXT</text>
    <text x="753" y="113" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#f5d97a">Prácticas pre-prof.</text>
    <text x="753" y="129" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="9" fill="#9a8a5a">¿Tu equipo? Hablemos</text>
  </g>
  <circle cx="810" cy="200" r="10" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.9" dur="0.4s" fill="freeze" begin="1.3s"/>
    <animate attributeName="r" values="8;14;8" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="810" cy="200" r="6" fill="#d4af37" filter="url(#rstrong)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.3s"/>
  </circle>
</svg>
